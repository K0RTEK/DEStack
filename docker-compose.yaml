services:
  postgres-airflow:
    build:
      context: ./services/postgres
      dockerfile: Dockerfile.airflow
    container_name: postgres-airflow
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - spark-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow -d airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  zookeeper:
    build:
      context: ./services/zookeeper
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOO_CLIENT_PORT: 2181
      ZOO_4LW_COMMANDS_WHITELIST: ruok, srvr, mntr, stat, conf, isro
      ZOO_STANDALONE_ENABLED: "true"
      ZOO_ADMINSERVER_ENABLED: "true"
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - spark-network

  kafka:
    build:
      context: ./services/kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
      - "9092:9092"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - spark-network
    restart: unless-stopped

  kafka-ui:
    build:
      context: ./services/kafka-ui
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
    ports:
      - "8081:8080"
    networks:
      - spark-network
    restart: unless-stopped

  debezium-connect:
    build:
      context: ./services/debezium
    container_name: debezium-connect
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    networks:
      - spark-network
    restart: unless-stopped

  minio:
    build:
      context: ./services/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - spark-network
    restart: unless-stopped

  createbuckets:
    build:
      context: ./services/minio-client
    container_name: createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /opt/bitnami/minio-client/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /opt/bitnami/minio-client/bin/mc mb --ignore-existing myminio/airflow-data;
      /opt/bitnami/minio-client/bin/mc mb --ignore-existing myminio/spark-data;
      /opt/bitnami/minio-client/bin/mc mb --ignore-existing myminio/kafka-data;
      /opt/bitnami/minio-client/bin/mc anonymous set download myminio/airflow-data;
      echo 'Buckets created successfully';
      "
    networks:
      - spark-network

  airflow-init:
    build:
      context: ./services/airflow
      dockerfile: Dockerfile
    container_name: airflow-init
    depends_on:
      - postgres-airflow
      - minio
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - _AIRFLOW_WWW_USER_FIRSTNAME=Admin
      - _AIRFLOW_WWW_USER_LASTNAME=User
      - _AIRFLOW_WWW_USER_EMAIL=admin@example.com
      - _AIRFLOW_WWW_USER_ROLE=Admin
      - AIRFLOW__CORE__FS_S3_CONN_ID=minio_s3
      - AIRFLOW__CORE__REMOTE_BASE_LOG_FOLDER=s3://airflow-data/logs
      - AIRFLOW__CORE__REMOTE_LOG_CONN_ID=minio_s3
    command: >
      bash -c "airflow db init &&
               airflow connections add 'minio_s3' \
                 --conn-type 'aws' \
                 --conn-login 'minioadmin' \
                 --conn-password 'minioadmin' \
                 --conn-extra '{\"endpoint_url\": \"http://minio:9000\", \"region_name\": \"us-east-1\"}' &&
               echo 'Пользователь admin создан с паролем: admin'"
    networks:
      - spark-network

  airflow-scheduler:
    build:
      context: ./services/airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    depends_on:
      - postgres-airflow
      - airflow-init
      - kafka
      - minio
      - mongodb
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - PYSPARK_PYTHON=python3
      - AIRFLOW__CORE__FS_S3_CONN_ID=minio_s3
      - AIRFLOW__CORE__REMOTE_BASE_LOG_FOLDER=s3://airflow-data/logs
      - AIRFLOW__CORE__REMOTE_LOG_CONN_ID=minio_s3
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags
      - ./services/airflow/logs:/opt/airflow/logs
      - ./services/jupyter/notebooks:/opt/airflow/notebooks
      - ./services/jupyter/data:/opt/airflow/data
    command: scheduler
    networks:
      - spark-network
    restart: unless-stopped

  airflow-webserver:
    build:
      context: ./services/airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    depends_on:
      - postgres-airflow
      - airflow-init
      - kafka
      - minio
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - PYSPARK_PYTHON=python3
      - AIRFLOW__CORE__FS_S3_CONN_ID=minio_s3
      - AIRFLOW__CORE__REMOTE_BASE_LOG_FOLDER=s3://airflow-data/logs
      - AIRFLOW__CORE__REMOTE_LOG_CONN_ID=minio_s3
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags
      - ./services/airflow/logs:/opt/airflow/logs
      - ./services/jupyter/notebooks:/opt/airflow/notebooks
      - ./services/jupyter/data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - spark-network
    restart: unless-stopped

  pyspark-jupyter:
    build:
      context: ./services/jupyter
      dockerfile: Dockerfile
    container_name: pyspark-jupyterlab
    depends_on:
      - kafka
      - minio
    ports:
      - "8888:8888"
      - "4040:4040"
      - "18080:18080"
    volumes:
      - ./services/jupyter/notebooks:/home/sparkuser/notebooks
      - ./services/jupyter/data:/home/sparkuser/data
      - ./services/jupyter/spark-events:/opt/spark/spark-events
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=jupyter
      - PYSPARK_DRIVER_PYTHON_OPTS=lab
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - spark-network
    restart: unless-stopped

  postgres-app:
    build:
      context: ./services/postgres
    container_name: postgres-app
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_MULTIPLE_DATABASES: "app_db,analytics_db,warehouse_db"
    volumes:
      - postgres-app-data:/var/lib/postgresql/data
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - spark-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d app_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    build:
      context: ./services/pgadmin
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./services/pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      postgres-app:
        condition: service_healthy
      postgres-airflow:
        condition: service_healthy
    networks:
      - spark-network
    restart: unless-stopped

  adminer:
    build:
      context: ./services/adminer
    container_name: adminer
    ports:
      - "8082:8080"
    networks:
      - spark-network
    restart: unless-stopped

  mongodb:
    build:
      context: ./services/mongodb
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: kirill
      MONGO_INITDB_ROOT_PASSWORD: 5567
      MONGO_INITDB_DATABASE: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - mongo-network
      - spark-network

  clickhouse:
    build:
      context: ./services/clickhouse
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--user", "clickhouse", "--password", "clickhouse", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - spark-network
    restart: unless-stopped

  clickhouse-ui:
    build:
      context: ./services/clickhouse-ui
    container_name: clickhouse-ui
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      PORT: 3488
    ports:
      - "3488:3488"
    volumes:
      - ch-ui-data:/app/data
    networks:
      - spark-network
    restart: unless-stopped

  superset-postgres:
    build:
      context: ./services/postgres
    container_name: superset-postgres
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset-postgres-data:/var/lib/postgresql/data
    networks:
      - spark-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U superset -d superset" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  superset-redis:
    build:
      context: ./services/redis
    container_name: superset-redis
    volumes:
      - superset-redis-data:/data
    networks:
      - spark-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  superset-init:
    build:
      context: ./services/superset
    container_name: superset-init
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: sandbox_superset_secret_key_change_me
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:superset@superset-postgres:5432/superset
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./services/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      /bin/sh -c "
      superset db upgrade &&
      (superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true) &&
      superset init &&
      echo 'Superset initialized'
      "
    networks:
      - spark-network

  superset:
    build:
      context: ./services/superset
    container_name: superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: sandbox_superset_secret_key_change_me
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:superset@superset-postgres:5432/superset
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./services/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    command: >
      /bin/sh -c "gunicorn -w 2 -k gthread --threads 4 --timeout 120 -b 0.0.0.0:8088 'superset.app:create_app()'"
    networks:
      - spark-network
    restart: unless-stopped

volumes:
  postgres-airflow-data:
  minio-data:
  zookeeper-data:
  kafka-data:
  postgres-app-data:
  pgadmin-data:
  mongodb_data:
  mongodb_config:
  clickhouse-data:
  clickhouse-logs:
  ch-ui-data:
  superset-postgres-data:
  superset-redis-data:

networks:
  spark-network:
    driver: bridge
  mongo-network:
    driver: bridge